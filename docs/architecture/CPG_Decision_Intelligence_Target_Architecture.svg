t x="188" y="406" class="body">Governed metrics → Signals → Diagnosis + enterprise truth → Decision</text><path d="M770 421 L770 443" stroke="#6C778A" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="443" width="1220" height="60" rx="10" fill="#D6F1EF" stroke="#AEB8C5"/><text x="188" y="466" class="layer">AGENTIC / EXPERIENCE</text><text x="188" y="488" class="body">Web app • APIs • assistant • BI • Genie • command centre</text><path d="M770 503 L770 525" stroke="#6C778A" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="525" width="1220" height="60" rx="10" fill="#FBE5C7" stroke="#AEB8C5"/><text x="188" y="548" class="layer">SYSTEMS OF EXECUTION</text><text x="188" y="570" class="body">Workflow • DAM • PIM • CMS / DXP • commerce / retail / ESP</text><path d="M770 585 L770 607" stroke="#6C778A" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="607" width="1220" height="60" rx="10" fill="#DDF2E4" stroke="#AEB8C5"/><text x="188" y="630" class="layer">MEASUREMENT LOOP</text><text x="188" y="652" class="body">Reassessment → comparable outcome → learning → next sensing cycle</text><path d="M1400 690 C1500 690 1510 120 1380 120" fill="none" stroke="#0B7D77" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/><text x="1220" y="410" class="small" transform="rotate(-82 1220 410)">feedback / reassessment</text><rect x="1400" y="115" width="25" height="574" rx="8" fill="#303744"/><text x="1413" y="410" fill="#fff" font-size="8" font-family="Arial" transform="rotate(-90 1413 410)" text-anchor="middle">SECURITY</text><rect x="1434" y="115" width="25" height="574" rx="8" fill="#303744"/><text x="1447" y="410" fill="#fff" font-size="8" font-family="Arial" transform="rotate(-90 1447 410)" text-anchor="middle">GOVERNANCE</text><rect x="1468" y="115" width="25" height="574" rx="8" fill="#303744"/><text x="1481" y="410" fill="#fff" font-size="8" font-family="Arial" transform="rotate(-90 1481 410)" text-anchor="middle">LINEAGE</text><rect x=